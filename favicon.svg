<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#ececec"/>

  <!-- Dartboard -->
  <g transform="translate(32 36)" fill="none" stroke="#0b0b0b" stroke-linecap="round" stroke-linejoin="round">
    <circle r="22.5" stroke-width="2.8"/>
    <circle r="20.3" stroke-width="1.3"/>
    <circle r="16.1" stroke-width="1.1"/>
    <circle r="11.1" stroke-width="1.1"/>
    <circle r="2.0" stroke-width="1.4" fill="#0b0b0b"/>

    <g stroke-width="1.05">
      <line x1="0" y1="-20.3" x2="0" y2="20.3"/>
      <line x1="-20.3" y1="0" x2="20.3" y2="0"/>
      <line x1="-14.35" y1="-14.35" x2="14.35" y2="14.35"/>
      <line x1="14.35" y1="-14.35" x2="-14.35" y2="14.35"/>
      <line x1="-18.52" y1="-6.74" x2="18.52" y2="6.74"/>
      <line x1="18.52" y1="-6.74" x2="-18.52" y2="6.74"/>
      <line x1="-6.74" y1="-18.52" x2="6.74" y2="18.52"/>
      <line x1="6.74" y1="-18.52" x2="-6.74" y2="18.52"/>
    </g>

    <!-- alternating wedges -->
    <g fill="#0b0b0b" stroke="none">
      <path d="M 0 -20.3 L 2.7 -11.1 L -2.7 -11.1 Z"/>
      <path d="M 10.15 -17.58 L 8.05 -8.9 L 2.6 -11.1 Z"/>
      <path d="M 17.58 -10.15 L 11.1 -2.7 L 8.9 -8.05 Z"/>
      <path d="M 20.3 0 L 11.1 2.7 L 11.1 -2.7 Z"/>
      <path d="M 17.58 10.15 L 8.9 8.05 L 11.1 2.7 Z"/>
      <path d="M 10.15 17.58 L 2.6 11.1 L 8.05 8.9 Z"/>
      <path d="M 0 20.3 L 2.7 11.1 L -2.7 11.1 Z"/>
      <path d="M -10.15 17.58 L -2.6 11.1 L -8.05 8.9 Z"/>
      <path d="M -17.58 10.15 L -11.1 2.7 L -8.9 8.05 Z"/>
      <path d="M -20.3 0 L -11.1 2.7 L -11.1 -2.7 Z"/>
      <path d="M -17.58 -10.15 L -8.9 -8.05 L -11.1 -2.7 Z"/>
      <path d="M -10.15 -17.58 L -2.6 -11.1 L -8.05 -8.9 Z"/>
    </g>
  </g>

  <!-- Left dart -->
  <g transform="translate(17 13) rotate(-39)" stroke="#0b0b0b" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="#f7f7f7">
    <line x1="0" y1="-8" x2="0" y2="12"/>
    <polygon points="-3,-12 0,-18 3,-12 2,-8 -2,-8" fill="#0b0b0b"/>
    <line x1="-2.7" y1="8" x2="2.7" y2="8"/>
    <line x1="-2.7" y1="6" x2="2.7" y2="6"/>
    <polygon points="0,12 -1.8,15.4 1.8,15.4" fill="#0b0b0b"/>
  </g>

  <!-- Right dart -->
  <g transform="translate(47 13) rotate(39)" stroke="#0b0b0b" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="#f7f7f7">
    <line x1="0" y1="-8" x2="0" y2="12"/>
    <polygon points="-3,-12 0,-18 3,-12 2,-8 -2,-8" fill="#0b0b0b"/>
    <line x1="-2.7" y1="8" x2="2.7" y2="8"/>
    <line x1="-2.7" y1="6" x2="2.7" y2="6"/>
    <polygon points="0,12 -1.8,15.4 1.8,15.4" fill="#0b0b0b"/>
  </g>
</svg>
