<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darts Score</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="score-panel">
        <header class="panel-header">
          <div>
            <h1 class="title-row">
              <svg id="desktopLegsToggle" class="title-dart-icon desktop-legs-toggle" viewBox="0 0 120 36" aria-label="Toggle leg score">
                <polygon points="108,8 118,18 108,28 96,24 96,12" />
                <rect x="90" y="15" width="22" height="6" rx="3" />
                <circle cx="88" cy="18" r="4" />
                <rect x="18" y="17" width="66" height="2" rx="1" />
                <rect x="58" y="14" width="4" height="8" rx="1" />
                <rect x="52" y="14" width="3" height="8" rx="1" />
                <rect x="46" y="14" width="3" height="8" rx="1" />
                <rect x="14" y="15" width="6" height="6" rx="2" />
                <polygon points="2,18 14,18 14,20 2,20" />
              </svg>
              <span id="titleLabel">Darts Score</span>
            </h1>
          </div>
          <a
            class="app-logo"
            href="https://my-web2-0.vercel.app"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="VT portfolio"
          >
            <span class="logo-mark">&lt;/&gt;</span>
            <span class="logo-text">VT</span>
          </a>
          <div class="panel-actions">
            <button id="languageBtn" type="button" aria-label="Switch language">🌐 UA/EN</button>
            <button id="legsToggleBtn" type="button">Рахунок</button>
            <button id="undoBtn" type="button">Undo</button>
            <button id="newGameBtn" type="button">New game</button>
          </div>
        </header>

        <section class="legs-box">
          <h3 id="legsTitle">Рахунок по партіях</h3>
          <div id="legsScore" class="legs-score"></div>
        </section>

        <div id="players" class="players"></div>

        <footer class="panel-footer">
          <p id="legResult" class="leg-result"></p>
          <p id="checkoutHint" class="checkout-hint"></p>
        </footer>
      </section>

      <section id="boardWrap" class="board-wrap">
        <svg id="board" viewBox="0 0 840 840" aria-label="Darts board"></svg>
      </section>
    </main>
    <section id="setupOverlay" class="setup-overlay">
      <div class="setup-modal">
        <h2 id="setupTitle" class="setup-brand-title" aria-label="Darts Score">
          <span class="setup-brand-row">
            <svg class="title-dart-icon setup-title-dart-icon" viewBox="0 0 120 36" aria-hidden="true">
              <polygon points="108,8 118,18 108,28 96,24 96,12" />
              <rect x="90" y="15" width="22" height="6" rx="3" />
              <circle cx="88" cy="18" r="4" />
              <rect x="18" y="17" width="66" height="2" rx="1" />
              <rect x="58" y="14" width="4" height="8" rx="1" />
              <rect x="52" y="14" width="3" height="8" rx="1" />
              <rect x="46" y="14" width="3" height="8" rx="1" />
              <rect x="14" y="15" width="6" height="6" rx="2" />
              <polygon points="2,18 14,18 14,20 2,20" />
            </svg>
            <span id="setupBrandLabel">Darts Score</span>
            <span class="setup-byline" aria-label="By VT logo">
              <span class="setup-byline-text">By</span>
              <a
                class="setup-byline-logo"
                href="https://my-web2-0.vercel.app"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="VT portfolio"
              >
                <span class="setup-byline-mark">&lt;/&gt;</span>
                <span class="setup-byline-vt">VT</span>
              </a>
            </span>
          </span>
        </h2>
        <p id="setupSubtitle">Додайте гравців і запустіть матч 301.</p>
        <div class="start-score-toggle" aria-label="Start score">
          <button id="start301Btn" type="button" class="mode-btn active">301</button>
          <button id="start501Btn" type="button" class="mode-btn">501</button>
        </div>
        <div id="nameFields" class="name-fields"></div>
        <div class="setup-actions">
          <button id="addPlayerBtn" type="button">+ Додати гравця</button>
          <button id="startGameBtn" type="button">Почати гру</button>
        </div>
      </div>
    </section>

    <section id="finishOverlay" class="setup-overlay hidden">
      <div class="setup-modal">
        <h2 id="finishTitle">Партію закрито</h2>
        <p id="finishText"></p>
        <div class="setup-actions">
          <button id="nextLegBtn" type="button">Наступна партія</button>
        </div>
      </div>
    </section>

    <section id="bullOverlay" class="setup-overlay hidden">
      <div class="setup-modal">
        <h2 id="bullTitle" class="bull-neon-title" aria-label="BULL">
          <span id="bullTitleText">BULL</span>
        </h2>
        <p id="bullText">Усі кинули 39 дротиків. Хто ближче до центру?</p>
        <div id="bullPlayers" class="setup-actions"></div>
      </div>
    </section>

    <a
      class="mobile-bottom-logo"
      href="https://my-web2-0.vercel.app"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="VT portfolio"
    >
      <span class="mobile-bottom-mark">&lt;/&gt;</span>
      <span class="mobile-bottom-text">VT</span>
    </a>

    <script src="app.js"></script>
  </body>
</html>
