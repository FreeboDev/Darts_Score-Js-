<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darts Score</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="score-panel">
        <header class="panel-header">
          <div>
            <h1 class="title-row">
              <svg id="desktopLegsToggle" class="title-dart-icon desktop-legs-toggle" viewBox="0 0 120 36" aria-label="Toggle leg score">
                <polygon points="108,8 118,18 108,28 96,24 96,12" />
                <rect x="90" y="15" width="22" height="6" rx="3" />
                <circle cx="88" cy="18" r="4" />
                <rect x="18" y="17" width="66" height="2" rx="1" />
                <rect x="58" y="14" width="4" height="8" rx="1" />
                <rect x="52" y="14" width="3" height="8" rx="1" />
                <rect x="46" y="14" width="3" height="8" rx="1" />
                <rect x="14" y="15" width="6" height="6" rx="2" />
                <polygon points="2,18 14,18 14,20 2,20" />
              </svg>
              <span id="titleLabel">Darts Score</span>
            </h1>
          </div>
          <a
            class="app-logo"
            href="https://my-web2-0.vercel.app"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="VT portfolio"
          >
            <span class="logo-mark">&lt;/&gt;</span>
            <span class="logo-text">VT</span>
          </a>
          <div class="panel-actions">
            <button id="languageBtn" type="button" aria-label="Switch language">🌐 UA/EN</button>
            <button id="legsToggleBtn" type="button">Рахунок</button>
            <button id="undoBtn" type="button">Undo</button>
            <button id="newGameBtn" type="button">New game</button>
          </div>
        </header>

        <section class="legs-box">
          <h3 id="legsTitle">Рахунок по партіях</h3>
          <div id="legsScore" class="legs-score"></div>
        </section>

        <div id="players" class="players"></div>

        <footer class="panel-footer">
          <p id="legResult" class="leg-result"></p>
          <p id="checkoutHint" class="checkout-hint"></p>
        </footer>
      </section>

      <section id="boardWrap" class="board-wrap">
        <button id="quickOutBtn" type="button" class="quick-out-btn hidden">3x OUT</button>
        <svg id="board" viewBox="0 0 840 840" aria-label="Darts board"></svg>
      </section>
    </main>
    <section id="setupOverlay" class="setup-overlay">
      <div class="setup-modal">
        <h2 id="setupTitle" class="setup-brand-title" aria-label="Darts Score">
          <span class="setup-brand-row">
            <svg class="title-dart-icon setup-title-dart-icon" viewBox="0 0 120 36" aria-hidden="true">
              <polygon points="108,8 118,18 108,28 96,24 96,12" />
              <rect x="90" y="15" width="22" height="6" rx="3" />
              <circle cx="88" cy="18" r="4" />
              <rect x="18" y="17" width="66" height="2" rx="1" />
              <rect x="58" y="14" width="4" height="8" rx="1" />
              <rect x="52" y="14" width="3" height="8" rx="1" />
              <rect x="46" y="14" width="3" height="8" rx="1" />
              <rect x="14" y="15" width="6" height="6" rx="2" />
              <polygon points="2,18 14,18 14,20 2,20" />
            </svg>
            <span id="setupBrandLabel">Darts Score</span>
            <span class="setup-byline" aria-label="By VT logo">
              <span class="setup-byline-text">By</span>
              <a
                class="setup-byline-logo"
                href="https://my-web2-0.vercel.app"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="VT portfolio"
              >
                <span class="setup-byline-mark">&lt;/&gt;</span>
                <span class="setup-byline-vt">VT</span>
              </a>
            </span>
          </span>
        </h2>
        <div class="auth-controls setup-auth-controls">
          <button id="googleAuthBtn" type="button" class="auth-btn auth-icon-btn" aria-label="Sign in with Google">
            G
          </button>
          <button id="appleAuthBtn" type="button" class="auth-btn auth-icon-btn" aria-label="Sign in with Apple">
            
          </button>
          <button id="logoutAuthBtn" type="button" class="auth-btn hidden">Logout</button>
        </div>
        <p id="setupSubtitle">Додайте гравців і запустіть матч 301.</p>
        <div class="setup-mode-row">
          <div class="start-score-toggle" aria-label="Start score">
            <svg class="mode-target-icon mode-target-icon-leading" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <circle cx="12" cy="12" r="4.2"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
            </svg>
            <button id="start301Btn" type="button" class="mode-btn active">301</button>
            <button id="start501Btn" type="button" class="mode-btn">501</button>
          </div>
          <div class="bull-limit-control">
            <label id="bullLimitLabel" for="bullLimitInput">Bull-off darts</label>
            <div class="bull-limit-spinner">
              <input id="bullLimitInput" type="number" min="1" step="1" value="39" />
              <div class="bull-limit-arrows" aria-hidden="true">
                <button id="bullLimitIncBtn" type="button" class="bull-limit-arrow bull-limit-arrow-up">▲</button>
                <button id="bullLimitDecBtn" type="button" class="bull-limit-arrow bull-limit-arrow-down">▼</button>
              </div>
            </div>
          </div>
          <div class="sets-limit-control">
            <label id="setsToWinLabel" for="setsToWinInput">Sets to win</label>
            <div class="bull-limit-spinner">
              <input id="setsToWinInput" type="number" min="1" step="1" value="1" />
              <div class="bull-limit-arrows" aria-hidden="true">
                <button id="setsIncBtn" type="button" class="bull-limit-arrow bull-limit-arrow-up">▲</button>
                <button id="setsDecBtn" type="button" class="bull-limit-arrow bull-limit-arrow-down">▼</button>
              </div>
            </div>
          </div>
        </div>
        <div id="nameFields" class="name-fields"></div>
        <div class="setup-actions">
          <button id="addPlayerBtn" type="button">+ Додати гравця</button>
          <button id="startGameBtn" type="button">Почати гру</button>
        </div>
      </div>
    </section>

    <section id="finishOverlay" class="setup-overlay hidden">
      <div class="setup-modal">
        <h2 id="finishTitle">Партію закрито</h2>
        <p id="finishText"></p>
        <div id="finishWinner" class="finish-winner"></div>
        <div id="finishStats" class="finish-stats hidden">
          <div class="finish-stat">
            <svg class="finish-icon finish-dart-icon" viewBox="0 0 120 36" aria-hidden="true">
              <polygon points="108,8 118,18 108,28 96,24 96,12"></polygon>
              <rect x="90" y="15" width="22" height="6" rx="3"></rect>
              <circle cx="88" cy="18" r="4"></circle>
              <rect x="18" y="17" width="66" height="2" rx="1"></rect>
              <rect x="58" y="14" width="4" height="8" rx="1"></rect>
              <rect x="52" y="14" width="3" height="8" rx="1"></rect>
              <rect x="46" y="14" width="3" height="8" rx="1"></rect>
              <rect x="14" y="15" width="6" height="6" rx="2"></rect>
              <polygon points="2,18 14,18 14,20 2,20"></polygon>
            </svg>
            <div class="finish-stat-text">
              <div id="finishDartsValue" class="finish-stat-value">0</div>
              <div id="finishDartsLabel" class="finish-stat-label">Darts</div>
            </div>
          </div>
          <div class="finish-stat">
            <svg class="finish-icon finish-avg-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <circle cx="12" cy="12" r="4.2"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
            </svg>
            <div class="finish-stat-text">
              <div id="finishAvgValue" class="finish-stat-value">0.0</div>
              <div id="finishAvgLabel" class="finish-stat-label">Avg</div>
            </div>
          </div>
          <div class="finish-stat">
            <svg class="finish-icon finish-flag-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 20V4"></path>
              <path d="M6 5h11l-2 3 2 3H6"></path>
            </svg>
            <div class="finish-stat-text">
              <div id="finishCloseValue" class="finish-stat-value">1</div>
              <div id="finishCloseLabel" class="finish-stat-label">Dart</div>
            </div>
          </div>
        </div>
        <div class="setup-actions">
          <button id="nextLegBtn" type="button">Наступна партія</button>
        </div>
      </div>
    </section>

    <section id="bullOverlay" class="setup-overlay hidden">
      <div class="setup-modal">
        <h2 id="bullTitle" class="bull-neon-title" aria-label="BULL">
          <span id="bullTitleText">BULL</span>
        </h2>
        <p id="bullText">Усі кинули 39 дротиків. Хто ближче до центру?</p>
        <div id="bullPlayers" class="setup-actions"></div>
      </div>
    </section>

    <a
      class="mobile-bottom-logo"
      href="https://my-web2-0.vercel.app"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="VT portfolio"
    >
      <span class="mobile-bottom-mark">&lt;/&gt;</span>
      <span class="mobile-bottom-text">VT</span>
    </a>

    <script src="app.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
